name: EmissaryNode
options:
  bundleIdPrefix: com.emissary
  deploymentTarget:
    iOS: "16.4"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_BITCODE: NO
    CODE_SIGNING_ALLOWED: NO
targets:
  EmissaryNode:
    type: application
    platform: iOS
    sources: [EmissaryNode]
    dependencies:
      - framework: llama.cpp/build-apple/llama.xcframework
        embed: true
    info:
      path: EmissaryNode/Info.plist
      properties:
        CFBundleDisplayName: EMISSARY Node
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
